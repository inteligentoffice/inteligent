<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 750px;
            width: 90%;
        }

        .logo-area {
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 50px;
        }
        .logo-text {
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: #111;
            margin: 0;
        }

        .menu-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button, .btn-link {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover, .btn-link:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        .section-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .back-btn {
            background-color: #d9534f;
            margin-top: 15px;
            width: 100%;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }

        /* Sekcja Gry Wojny Pixeli */
        .game-board {
            background: #1e1e2e;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        #poland-map {
            width: 100%;
            max-width: 520px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .voivodeship {
            fill: #313244;
            stroke: #1e1e2e;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.3s;
        }

        .voivodeship:hover {
            fill: #585b70;
        }

        /* Kolory Frakcji */
        .voivodeship.player {
            fill: #22c55e !important; /* Zielony - Ty */
        }

        .voivodeship.bot-red {
            fill: #ef4444 !important; /* Czerwony - Bot */
        }

        .voivodeship.bot-blue {
            fill: #3b82f6 !important; /* Niebieski - Bot */
        }

        .voivodeship.bot-yellow {
            fill: #eab308 !important; /* Żółty - Bot */
        }

        #secret-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #ff3366;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 60px;
            border-radius: 20px;
            z-index: 1000;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">🔍</div>
            <h1 class="logo-text">inteligent</h1>
        </div>

        <div id="main-menu" class="menu-options">
            <button onclick="showSection('search-section')">1. Wyszukaj miasto</button>
            <button onclick="showSection('pixels-section'); startGame();">2. Wojny Pixeli</button>
            <button onclick="showSection('notes-section')">3. Notatki</button>
            <button onclick="triggerSecret()">4. ? :D</button>
        </div>

        <!-- Opcja 1 -->
        <div id="search-section" class="section-content">
            <h3>Wyszukiwarka Miast</h3>
            <p>Wpisz miasto, które chcesz sprawdzić:</p>
            <input type="text" id="city-input" placeholder="np. Warszawa, Kraków...">
            <button onclick="searchCity()">Szukaj w bazie</button>
            <div id="city-result" style="margin-top: 10px; font-weight: bold;"></div>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>

        <!-- Opcja 2: WOJNY PIXELI (Prawdziwy kształt Polski) -->
        <div id="pixels-section" class="section-content">
            <h3>Wojny Pixeli: Bitwa 4 Frakcji ⚔️</h3>
            <div class="game-board">
                <div class="score-board">
                    <span style="color: #4ade80;">🟢 Ty: <span id="score-green">0</span></span>
                    <span style="color: #f87171;">🔴 Czerwony: <span id="score-red">0</span></span>
                    <span style="color: #60a5fa;">🔵 Niebieski: <span id="score-blue">0</span></span>
                    <span style="color: #facc15;">🟡 Żółty: <span id="score-yellow">0</span></span>
                </div>
                <p style="font-size: 14px; color: #a6adc8;">Wybieraj województwa na dokładnej mapie Polski!</p>
                
                <!-- Dokładna mapa Polski wpasowana w idealny obrys -->
                <svg id="poland-map" viewBox="0 0 550 520">
                    <!-- Zachodniopomorskie -->
                    <path class="voivodeship" id="zachodniopomorskie" d="M 30,110 Q 70,80 120,75 L 145,150 L 90,175 L 30,150 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Pomorskie -->
                    <path class="voivodeship" id="pomorskie" d="M 120,75 Q 190,65 240,85 L 235,160 L 145,150 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Warmińsko-Mazurskie -->
                    <path class="voivodeship" id="warminsko-mazurskie" d="M 240,85 Q 310,75 370,100 L 360,185 L 235,160 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Podlaskie -->
                    <path class="voivodeship" id="podlaskie" d="M 370,100 Q 430,110 455,160 L 440,250 L 360,185 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Lubuskie -->
                    <path class="voivodeship" id="lubuskie" d="M 30,150 L 90,175 L 95,270 L 40,250 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Wielkopolskie -->
                    <path class="voivodeship" id="wielkopolskie" d="M 90,175 L 145,150 L 235,160 L 250,285 L 95,270 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Kujawsko-Pomorskie -->
                    <path class="voivodeship" id="kujawsko-pomorskie" d="M 235,160 L 360,185 L 310,255 L 250,285 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Mazowieckie -->
                    <path class="voivodeship" id="mazowieckie" d="M 360,185 L 440,250 L 420,330 L 310,310 L 310,255 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Dolnośląskie -->
                    <path class="voivodeship" id="dolnoslaskie" d="M 40,250 L 95,270 L 150,320 L 100,395 L 45,340 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Łódzkie -->
                    <path class="voivodeship" id="lodzkie" d="M 250,285 L 310,255 L 310,310 L 270,375 L 160,335 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Lubelskie -->
                    <path class="voivodeship" id="lubelskie" d="M 420,330 L 440,250 L 470,350 L 380,410 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Opolskie -->
                    <path class="voivodeship" id="opolskie" d="M 150,320 L 160,335 L 205,395 L 130,400 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Śląskie -->
                    <path class="voivodeship" id="slaskie" d="M 160,335 L 270,375 L 265,445 L 205,395 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Świętokrzyskie -->
                    <path class="voivodeship" id="swietokrzyskie" d="M 310,310 L 380,410 L 290,445 L 270,375 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Małopolskie -->
                    <path class="voivodeship" id="malopolskie" d="M 270,375 L 290,445 L 360,485 L 250,490 Z" onclick="claimVoivodeship(this)"></path>
                    <!-- Podkarpackie -->
                    <path class="voivodeship" id="podkarpackie" d="M 380,410 L 470,350 L 440,500 L 360,485 Z" onclick="claimVoivodeship(this)"></path>
                </svg>

                <p id="game-status" style="margin-top: 15px; font-weight: bold; font-size: 18px;"></p>
            </div>
            <button class="back-btn" onclick="stopGame(); hideSections();">Powrót do menu</button>
        </div>

        <!-- Opcja 3 -->
        <div id="notes-section" class="section-content">
            <h3>Twoje Notatki</h3>
            <textarea id="user-note" rows="4" placeholder="Wpisz swoją notatkę tutaj..."></textarea>
            <button onclick="saveNote()">Zapisz i wyślij</button>
            <p id="note-status" style="color: green; font-size: 14px;"></p>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>
    </div>

    <div id="secret-popup">:D</div>

    <script>
        function showSection(sectionId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function hideSections() {
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById('main-menu').style.display = 'grid';
        }

        function searchCity() {
            const city = document.getElementById('city-input').value;
            const resultDiv = document.getElementById('city-result');
            if(city.trim() === "") {
                resultDiv.innerText = "Wpisz nazwę miasta!";
                resultDiv.style.color = "red";
            } else {
                resultDiv.innerText = `Znaleziono dane dla miasta: ${city}. Status: Bezpieczne terytorium.`;
                resultDiv.style.color = "green";
            }
        }

        function saveNote() {
            const noteText = document.getElementById('user-note').value;
            if(noteText.trim() !== "") {
                localStorage.setItem('inteligent_note', noteText);
                document.getElementById('note-status').innerText = "Notatka została zapisana pomyślnie!";
            } else {
                document.getElementById('note-status').innerText = "Notatka jest pusta!";
                document.getElementById('note-status').style.color = "red";
            }
        }

        function triggerSecret() {
            const popup = document.getElementById('secret-popup');
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }

        /* LOGIKA BITWY 4 FRAKCJI */
        let scores = { green: 0, red: 0, blue: 0, yellow: 0 };
        let botInterval = null;

        function startGame() {
            scores = { green: 0, red: 0, blue: 0, yellow: 0 };
            updateScores();
            document.getElementById('game-status').innerText = "";

            document.querySelectorAll('.voivodeship').forEach(el => {
                el.className.baseVal = "voivodeship";
            });

            clearInterval(botInterval);
            botInterval = setInterval(botsAttack, 1200);
        }

        function stopGame() {
            clearInterval(botInterval);
        }

        function claimVoivodeship(element) {
            if (isClaimed(element)) return;

            element.classList.add('player');
            scores.green++;
            updateScores();
            checkWinner();
        }

        function botsAttack() {
            const available = Array.from(document.querySelectorAll('.voivodeship')).filter(e => !isClaimed(e));
            if (available.length === 0) {
                checkWinner();
                return;
            }

            const botTypes = ['bot-red', 'bot-blue', 'bot-yellow'];
            const randomBot = botTypes[Math.floor(Math.random() * botTypes.length)];
            const randomTarget = available[Math.floor(Math.random() * available.length)];

            randomTarget.classList.add(randomBot);

            if (randomBot === 'bot-red') scores.red++;
            if (randomBot === 'bot-blue') scores.blue++;
            if (randomBot === 'bot-yellow') scores.yellow++;

            updateScores();
            checkWinner();
        }

        function isClaimed(element) {
            return element.classList.contains('player') || 
                   element.classList.contains('bot-red') || 
                   element.classList.contains('bot-blue') || 
                   element.classList.contains('bot-yellow');
        }

        function updateScores() {
            document.getElementById('score-green').innerText = scores.green;
            document.getElementById('score-red').innerText = scores.red;
            document.getElementById('score-blue').innerText = scores.blue;
            document.getElementById('score-yellow').innerText = scores.yellow;
        }

        function checkWinner() {
            const total = document.querySelectorAll('.voivodeship').length;
            const totalClaimed = scores.green + scores.red + scores.blue + scores.yellow;

            if (totalClaimed >= total) {
                stopGame();
                const status = document.getElementById('game-status');
                const maxScore = Math.max(scores.green, scores.red, scores.blue, scores.yellow);

                if (scores.green === maxScore) {
                    status.innerText = "🎉 ZWYCIĘSTWO! Zdominowałeś całą Polskę!";
                    status.style.color = "#4ade80";
                } else if (scores.red === maxScore) {
                    status.innerText = "❌ Wygrał Czerwony Bot!";
                    status.style.color = "#ef4444";
                } else if (scores.blue === maxScore) {
                    status.innerText = "❌ Wygrał Niebieski Bot!";
                    status.style.color = "#3b82f6";
                } else {
                    status.innerText = "❌ Wygrał Żółty Bot!";
                    status.style.color = "#eab308";
                }
            }
        }
    </script>
</body>
</html>
