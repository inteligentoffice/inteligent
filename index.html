<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligent - Wojny Pixeli v0.10🎉</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121218;
            color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #1e1e2e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 1100px;
            width: 98%;
            position: relative;
        }

        .version-tag {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 16px;
            color: #facc15;
            font-weight: bold;
        }

        .logo-text {
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            color: #fff;
            margin: 0 0 15px 0;
        }

        .menu-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button, .btn-link {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #313244;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #45475a;
            transform: translateY(-2px);
        }

        .section-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #45475a;
            padding-top: 20px;
        }

        .back-btn {
            background-color: #d9534f;
            margin-top: 15px;
            width: 100%;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }

        /* Panel Strategiczny Gry */
        .game-board {
            background: #11111b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stats-panel {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            background: #181825;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .control-panel {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: #22c55e;
            color: black;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            border: none;
        }
        .action-btn:hover {
            background-color: #16a34a;
            color: white;
        }

        /* Mapa Polski SVG */
        #poland-map-svg {
            width: 100%;
            max-width: 480px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
            background: #181825;
            border-radius: 8px;
            padding: 10px;
        }

        .map-outline {
            fill: #313244;
            stroke: #45475a;
            stroke-width: 2;
        }

        /* Wielka Siatka Miast */
        .grid-map {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 3px;
            max-height: 450px;
            overflow-y: auto;
            padding: 8px;
            background: #000;
            border-radius: 8px;
            border: 1px solid #45475a;
        }

        .city-tile {
            background-color: #313244;
            border: 1px solid #45475a;
            border-radius: 3px;
            padding: 4px 1px;
            font-size: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            min-height: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .city-tile:hover {
            border-color: #fff;
            transform: scale(1.08);
            z-index: 10;
        }

        /* Frakcje / Kolory Właścicieli */
        .owner-neutral { background-color: #313244 !important; }
        .owner-green { background-color: #22c55e !important; color: #000 !important; }
        .owner-red { background-color: #ef4444 !important; }
        .owner-blue { background-color: #3b82f6 !important; }
        .owner-yellow { background-color: #eab308 !important; color: #000 !important; }
        .owner-purple { background-color: #a855f7 !important; }
        .owner-orange { background-color: #f97316 !important; }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            background: #222;
            color: #fff;
        }
    </style>
</head>

                </div>

                <div class="control-panel">
                    <button class="action-btn" onclick="buyArmy()">Kup Armię (+100 wojska za 10 zł)</button>

                </div>

                <!-- Mapa SVG Polski -->

            </div>
            <button class="back-btn" onclick="stopGame(); hideSections();">Powrót do menu</button>
        </div>

            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');

        let cities = [];
        let player = { gold: 100, army: 500 };
        let bots = {
            red: { army: 500 },
            blue: { army: 500 },
            yellow: { army: 500 },
            purple: { army: 500 },
            orange: { army: 500 }
        };
        let gameInterval = null;
        let ecoInterval = null;

        function initGame() {
            cities = [];
            player = { gold: 100, army: 500 };
            bots = {
                red: { army: 500 }, blue: { army: 500 }, yellow: { army: 500 }, purple: { army: 500 }, orange: { army: 500 }
            };
            document.getElementById('game-status').innerText = "";

            // Rozwinięcie bazy do dokładnie 1026 unikalnych terytoriów
            for (let i = 1; i <= 1026; i++) {
                let name = i <= allPolishTowns.length ? allPolishTowns[i - 1] : `${allPolishTowns[(i - 1) % allPolishTowns.length]} Sektor ${Math.ceil(i / allPolishTowns.length)}`;
                cities.push({
                    id: i,
                    name: name,
                    owner: 'neutral',
                    garrison: Math.floor(Math.random() * 50) + 10
                });
            }

            renderGrid();
            updateUI();

            clearInterval(gameInterval);
            clearInterval(ecoInterval);

            // Ekonomia: +1 zł co 0.5 sekundy
            ecoInterval = setInterval(() => {
                player.gold += 1;
                updateUI();
            }, 500);

            // Ruchy wojsk i botów co 1 sekundę
            gameInterval = setInterval(gameLoop, 1000);
        }

        function stopGame() {
            clearInterval(gameInterval);
            clearInterval(ecoInterval);
        }

        function buyArmy() {
            if (player.gold >= 10) {
                player.gold -= 10;
                player.army += 100;
                updateUI();
            } else {
                showGameAlert("Za mało złota! Potrzebujesz 10 zł.");
            }
        }

        function showGameAlert(msg) {
            const alertElem = document.getElementById('game-alert');
            alertElem.innerText = msg;
            setTimeout(() => alertElem.innerText = "", 2000);
        }

        function renderGrid() {
            const grid = document.getElementById('cities-grid');
            grid.innerHTML = '';
            cities.forEach((c, idx) => {
                const tile = document.createElement('div');
                tile.className = `city-tile owner-${c.owner}`;
                tile.id = `city-${idx}`;
                tile.innerHTML = `<span>${c.name}</span><span style="font-size:7px; opacity:0.8">⚔️${c.garrison}</span>`;
                tile.onclick = () => playerAttackCity(idx);
                grid.appendChild(tile);
            });
        }

        function updateTileUI(idx) {
            const c = cities[idx];
            const tile = document.getElementById(`city-${idx}`);
            if (tile) {
                tile.className = `city-tile owner-${c.owner}`;
                tile.innerHTML = `<span>${c.name}</span><span style="font-size:7px; opacity:0.8">⚔️${c.garrison}</span>`;
            }
        }

        function playerAttackCity(idx) {
            const target = cities[idx];
            if (target.owner === 'green') {
                showGameAlert("To Twoje miasto!");
                return;
            }

            if (player.army >= target.garrison) {
                player.army -= target.garrison;
                target.owner = 'green';
                target.garrison = Math.floor(player.army * 0.1) + 20;
                updateTileUI(idx);
                updateUI();
                checkWinCondition();
            } else {
                showGameAlert(`Za słaba armia! Garnizon: ${target.garrison}, Twoje wojsko: ${player.army}.`);
            }
        }

        function gameLoop() {
            const botKeys = Object.keys(bots);
            botKeys.forEach(bKey => {
                const targetIdx = Math.floor(Math.random() * cities.length);
                const target = cities[targetIdx];

                if (target.owner !== bKey && bots[bKey].army >= target.garrison) {
                    bots[bKey].army -= target.garrison;
                    target.owner = bKey;
                    target.garrison = Math.floor(bots[bKey].army * 0.05) + 15;
                    updateTileUI(targetIdx);
                }

                bots[bKey].army += 15;
            });

            checkPlayerDeath();
            updateUI();
        }

        function checkPlayerDeath() {
            const playerTerritories = cities.filter(c => c.owner === 'green').length;
            if (playerTerritories === 0 && player.army < 10) {
                stopGame();
                document.getElementById('game-status').innerHTML = "❌ <span style='color:red;'>UMARŁEŚ! Straciłeś wszystkie terytoria i armię! Zresetuj grę i spróbuj ponownie.</span>";
            }
        }

        function checkWinCondition() {
            const playerTerritories = cities.filter(c => c.owner === 'green').length;
            if (playerTerritories === 1026) {
                stopGame();
                document.getElementById('game-status').innerHTML = "🎉 <span style='color:green;'>ZWYCIĘSTWO! Podbiłeś całą Polskę!</span>";
            }
        }

        function updateUI() {
            let counts = { green: 0, red: 0, blue: 0, yellow: 0, purple: 0, orange: 0, neutral: 0 };
            cities.forEach(c => counts[c.owner]++);

            document.getElementById('s-green-t').innerText = counts.green;
            document.getElementById('s-green-a').innerText = player.army;
            document.getElementById('s-gold').innerText = player.gold;

            document.getElementById('s-red-t').innerText = counts.red;
            document.getElementById('s-red-a').innerText = bots.red.army;

            document.getElementById('s-blue-t').innerText = counts.blue;
            document.getElementById('s-blue-a').innerText = bots.blue.army;

            document.getElementById('s-yellow-t').innerText = counts.yellow;
            document.getElementById('s-yellow-a').innerText = bots.yellow.army;

            document.getElementById('s-purple-t').innerText = counts.purple;
            document.getElementById('s-purple-a').innerText = bots.purple.army;

            document.getElementById('s-orange-t').innerText = counts.orange;
            document.getElementById('s-orange-a').innerText = bots.orange.army;
        }
    </script>
</body>
</html>
