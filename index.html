<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 750px;
            width: 90%;
        }

        .logo-area {
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 50px;
        }
        .logo-text {
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: #111;
            margin: 0;
        }

        .menu-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button, .btn-link {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover, .btn-link:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        .section-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .back-btn {
            background-color: #d9534f;
            margin-top: 15px;
            width: 100%;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }

        /* Sekcja Gry Wojny Pixeli */
        .game-board {
            background: #1e1e2e;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        #poland-map {
            width: 100%;
            max-width: 520px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .voivodeship {
            fill: #313244;
            stroke: #11111b;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.3s;
        }

        .voivodeship:hover {
            fill: #585b70;
        }

        /* Kolory Frakcji */
        .voivodeship.player {
            fill: #22c55e !important; /* Zielony - Ty */
        }

        .voivodeship.bot-red {
            fill: #ef4444 !important; /* Czerwony - Bot */
        }

        .voivodeship.bot-blue {
            fill: #3b82f6 !important; /* Niebieski - Bot */
        }

        .voivodeship.bot-yellow {
            fill: #eab308 !important; /* Żółty - Bot */
        }

        .map-text {
            fill: #ffffff;
            font-size: 9px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
        }

        #secret-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #ff3366;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 60px;
            border-radius: 20px;
            z-index: 1000;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">🔍</div>
            <h1 class="logo-text">inteligent</h1>
        </div>

        <div id="main-menu" class="menu-options">
            <button onclick="showSection('search-section')">1. Wyszukaj miasto</button>
            <button onclick="showSection('pixels-section'); startGame();">2. Wojny Pixeli</button>
            <button onclick="showSection('notes-section')">3. Notatki</button>
            <button onclick="triggerSecret()">4. ? :D</button>
        </div>

        <!-- Opcja 1 -->
        <div id="search-section" class="section-content">
            <h3>Wyszukiwarka Miast</h3>
            <p>Wpisz miasto, które chcesz sprawdzić:</p>
            <input type="text" id="city-input" placeholder="np. Warszawa, Kraków...">
            <button onclick="searchCity()">Szukaj w bazie</button>
            <div id="city-result" style="margin-top: 10px; font-weight: bold;"></div>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>

        <!-- Opcja 2: WOJNY PIXELI (Prawdziwa Mapa Polski z granicami) -->
        <div id="pixels-section" class="section-content">
            <h3>Wojny Pixeli: Bitwa 4 Frakcji ⚔️</h3>
            <div class="game-board">
                <div class="score-board">
                    <span style="color: #4ade80;">🟢 Ty: <span id="score-green">0</span></span>
                    <span style="color: #f87171;">🔴 Czerwony: <span id="score-red">0</span></span>
                    <span style="color: #60a5fa;">🔵 Niebieski: <span id="score-blue">0</span></span>
                    <span style="color: #facc15;">🟡 Żółty: <span id="score-yellow">0</span></span>
                </div>
                <p style="font-size: 14px; color: #a6adc8;">Prawdziwa mapa Polski – walcz o terytoria!</p>
                
                <!-- Idealny zarys i granice Polski -->
                <svg id="poland-map" viewBox="0 0 500 480">
                    <g onclick="claimVoivodeship(event)">
                        <path class="voivodeship" id="zachodniopomorskie" data-name="Zachodniopomorskie" d="M 60,80 L 110,70 L 135,130 L 90,150 L 50,130 Z"></path>
                        <text class="map-text" x="85" y="110">Zach-pom</text>

                        <path class="voivodeship" id="pomorskie" data-name="Pomorskie" d="M 110,70 L 180,60 L 210,120 L 135,130 Z"></path>
                        <text class="map-text" x="160" y="95">Pomorskie</text>

                        <path class="voivodeship" id="warminsko-mazurskie" data-name="Warmińsko-Mazurskie" d="M 180,60 L 270,70 L 260,140 L 210,120 Z"></path>
                        <text class="map-text" x="235" y="100">War-Maz</text>

                        <path class="voivodeship" id="podlaskie" data-name="Podlaskie" d="M 270,70 L 330,90 L 320,170 L 260,140 Z"></path>
                        <text class="map-text" x="295" y="125">Podlaskie</text>

                        <path class="voivodeship" id="lubuskie" data-name="Lubuskie" d="M 50,130 L 90,150 L 95,220 L 40,200 Z"></path>
                        <text class="map-text" x="65" y="175">Lubuskie</text>

                        <path class="voivodeship" id="wielkopolskie" data-name="Wielkopolskie" d="M 90,150 L 135,130 L 210,120 L 225,220 L 95,220 Z"></path>
                        <text class="map-text" x="155" y="180">Wielkopolska</text>

                        <path class="voivodeship" id="kujawsko-pomorskie" data-name="Kujawsko-Pomorskie" d="M 210,120 L 260,140 L 245,200 L 225,220 Z"></path>
                        <text class="map-text" x="235" y="170">Kuj-Pom</text>

                        <path class="voivodeship" id="mazowieckie" data-name="Mazowieckie" d="M 260,140 L 320,170 L 310,250 L 245,200 Z"></path>
                        <text class="map-text" x="285" y="200">Mazowieckie</text>

                        <path class="voivodeship" id="lubelskie" data-name="Lubelskie" d="M 320,170 L 360,190 L 345,290 L 310,250 Z"></path>
                        <text class="map-text" x="335" y="235">Lubelskie</text>

                        <path class="voivodeship" id="dolnoslaskie" data-name="Dolnośląskie" d="M 40,200 L 95,220 L 130,280 L 80,310 L 45,270 Z"></path>
                        <text class="map-text" x="80" y="255">Dolnośląskie</text>

                        <path class="voivodeship" id="lodzkie" data-name="Łódzkie" d="M 225,220 L 245,200 L 310,250 L 295,310 L 210,290 Z"></path>
                        <text class="map-text" x="255" y="260">Łódzkie</text>

                        <path class="voivodeship" id="opolskie" data-name="Opolskie" d="M 130,280 L 160,275 L 175,335 L 125,330 Z"></path>
                        <text class="map-text" x="150" y="305">Opolskie</text>

                        <path class="voivodeship" id="slaskie" data-name="Śląskie" d="M 160,275 L 210,290 L 205,355 L 175,335 Z"></path>
                        <text class="map-text" x="187" y="315">Śląskie</text>

                        <path class="voivodeship" id="swietokrzyskie" data-name="Świętokrzyskie" d="M 295,310 L 310,250 L 345,290 L 325,355 L 280,350 Z"></path>
                        <text class="map-text" x="310" y="315">Świętokrzysz.</text>

                        <path class="voivodeship" id="malopolskie" data-name="Małopolskie" d="M 210,290 L 280,350 L 275,410 L 200,395 Z"></path>
                        <text class="map-text" x="240" y="360">Małopolskie</text>

                        <path class="voivodeship" id="podkarpackie" data-name="Podkarpackie" d="M 325,355 L 345,290 L 380,320 L 365,415 L 275,410 Z"></path>
                        <text class="map-text" x="330" y="370">Podkarpackie</text>
                    </g>
                </svg>

                <p id="game-status" style="margin-top: 15px; font-weight: bold; font-size: 18px;"></p>
            </div>
            <button class="back-btn" onclick="stopGame(); hideSections();">Powrót do menu</button>
        </div>

        <!-- Opcja 3 -->
        <div id="notes-section" class="section-content">
            <h3>Twoje Notatki</h3>
            <textarea id="user-note" rows="4" placeholder="Wpisz swoją notatkę tutaj..."></textarea>
            <button onclick="saveNote()">Zapisz i wyślij</button>
            <p id="note-status" style="color: green; font-size: 14px;"></p>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>
    </div>

    <div id="secret-popup">:D</div>

    <script>
        function showSection(sectionId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function hideSections() {
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById('main-menu').style.display = 'grid';
        }

        function searchCity() {
            const city = document.getElementById('city-input').value;
            const resultDiv = document.getElementById('city-result');
            if(city.trim() === "") {
                resultDiv.innerText = "Wpisz nazwę miasta!";
                resultDiv.style.color = "red";
            } else {
                resultDiv.innerText = `Znaleziono dane dla miasta: ${city}. Status: Bezpieczne terytorium.`;
                resultDiv.style.color = "green";
            }
        }

        function saveNote() {
            const noteText = document.getElementById('user-note').value;
            if(noteText.trim() !== "") {
                localStorage.setItem('inteligent_note', noteText);
                document.getElementById('note-status').innerText = "Notatka została zapisana pomyślnie!";
            } else {
                document.getElementById('note-status').innerText = "Notatka jest pusta!";
                document.getElementById('note-status').style.color = "red";
            }
        }

        function triggerSecret() {
            const popup = document.getElementById('secret-popup');
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }

        /* LOGIKA BITWY 4 FRAKCJI */
        let scores = { green: 0, red: 0, blue: 0, yellow: 0 };
        let botInterval = null;

        function startGame() {
            scores = { green: 0, red: 0, blue: 0, yellow: 0 };
            updateScores();
            document.getElementById('game-status').innerText = "";

            document.querySelectorAll('.voivodeship').forEach(el => {
                el.className.baseVal = "voivodeship";
            });

            clearInterval(botInterval);
            botInterval = setInterval(botsAttack, 1200);
        }

        function stopGame() {
            clearInterval(botInterval);
        }

        function claimVoivodeship(event) {
            const element = event.target.closest('.voivodeship');
            if (!element || isClaimed(element)) return;

            element.classList.add('player');
            scores.green++;
            updateScores();
            checkWinner();
        }

        function botsAttack() {
            const available = Array.from(document.querySelectorAll('.voivodeship')).filter(e => !isClaimed(e));
            if (available.length === 0) {
                checkWinner();
                return;
            }

            const botTypes = ['bot-red', 'bot-blue', 'bot-yellow'];
            const randomBot = botTypes[Math.floor(Math.random() * botTypes.length)];
            const randomTarget = available[Math.floor(Math.random() * available.length)];

            randomTarget.classList.add(randomBot);

            if (randomBot === 'bot-red') scores.red++;
            if (randomBot === 'bot-blue') scores.blue++;
            if (randomBot === 'bot-yellow') scores.yellow++;

            updateScores();
            checkWinner();
        }

        function isClaimed(element) {
            return element.classList.contains('player') || 
                   element.classList.contains('bot-red') || 
                   element.classList.contains('bot-blue') || 
                   element.classList.contains('bot-yellow');
        }

        function updateScores() {
            document.getElementById('score-green').innerText = scores.green;
            document.getElementById('score-red').innerText = scores.red;
            document.getElementById('score-blue').innerText = scores.blue;
            document.getElementById('score-yellow').innerText = scores.yellow;
        }

        function checkWinner() {
            const total = document.querySelectorAll('.voivodeship').length;
            const totalClaimed = scores.green + scores.red + scores.blue + scores.yellow;

            if (totalClaimed >= total) {
                stopGame();
                const status = document.getElementById('game-status');
                const maxScore = Math.Math.max ? Math.max(scores.green, scores.red, scores.blue, scores.yellow) : 0;

                if (scores.green >= scores.red && scores.green >= scores.blue && scores.green >= scores.yellow) {
                    status.innerText = "🎉 ZWYCIĘSTWO! Zdominowałeś całą Polskę!";
                    status.style.color = "#4ade80";
                } else {
                    status.innerText = "❌ KONIEC GRY! Boty przejęły większość terenów!";
                    status.style.color = "#f87171";
                }
            }
        }
    </script>
</body>
</html>
