<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 780px;
            width: 95%;
        }

        .logo-area {
            margin-bottom: 20px;
        }
        .logo-icon {
            font-size: 45px;
        }
        .logo-text {
            font-size: 38px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: #111;
            margin: 0;
        }

        .menu-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button, .btn-link {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover, .btn-link:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        .section-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .back-btn {
            background-color: #d9534f;
            margin-top: 15px;
            width: 100%;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }

        /* Sekcja Gry Wojny Pixeli */
        .game-board {
            background: #1e1e2e;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
        }

        #poland-map {
            width: 100%;
            max-width: 560px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .voivodeship {
            fill: #313244;
            stroke: #11111b;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.2s;
        }

        .voivodeship:hover {
            fill: #585b70;
        }

        /* Kolory Frakcji */
        .voivodeship.player {
            fill: #22c55e !important; /* Zielony - Ty */
        }

        .voivodeship.bot-red {
            fill: #ef4444 !important; /* Czerwony - Bot */
        }

        .voivodeship.bot-blue {
            fill: #3b82f6 !important; /* Niebieski - Bot */
        }

        .voivodeship.bot-yellow {
            fill: #eab308 !important; /* Żółty - Bot */
        }

        .map-text {
            fill: #ffffff;
            font-size: 8.5px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
        }

        .city-dot {
            fill: #ffffff;
            stroke: #000;
            stroke-width: 1;
            pointer-events: none;
        }

        .city-label {
            fill: #ffd700;
            font-size: 7px;
            font-weight: bold;
            pointer-events: none;
        }

        #secret-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #ff3366;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 60px;
            border-radius: 20px;
            z-index: 1000;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">🔍</div>
            <h1 class="logo-text">inteligent</h1>
        </div>

        <div id="main-menu" class="menu-options">
            <button onclick="showSection('search-section')">1. Wyszukaj miasto</button>
            <button onclick="showSection('pixels-section'); startGame();">2. Wojny Pixeli</button>
            <button onclick="showSection('notes-section')">3. Notatki</button>
            <button onclick="triggerSecret()">4. ? :D</button>
        </div>

        <!-- Opcja 1 -->
        <div id="search-section" class="section-content">
            <h3>Wyszukiwarka Miast</h3>
            <p>Wpisz miasto, które chcesz sprawdzić:</p>
            <input type="text" id="city-input" placeholder="np. Warszawa, Kraków...">
            <button onclick="searchCity()">Szukaj w bazie</button>
            <div id="city-result" style="margin-top: 10px; font-weight: bold;"></div>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>

        <!-- Opcja 2: WOJNY PIXELI (Pełna mapa z miastami i odbieraniem terenów) -->
        <div id="pixels-section" class="section-content">
            <h3>Wojny Pixeli: Bitwa o Polskę ⚔️</h3>
            <div class="game-board">
                <div class="score-board">
                    <span style="color: #4ade80;">🟢 Ty: <span id="score-green">0</span></span>
                    <span style="color: #f87171;">🔴 Czerwony: <span id="score-red">0</span></span>
                    <span style="color: #60a5fa;">🔵 Niebieski: <span id="score-blue">0</span></span>
                    <span style="color: #facc15;">🟡 Żółty: <span id="score-yellow">0</span></span>
                </div>
                <p style="font-size: 13px; color: #a6adc8;">Boty atakują co 1 sek! Możesz odbierać im tereny, klikając w ich województwa!</p>
                
                <!-- Mapa Polski z miastami -->
                <svg id="poland-map" viewBox="0 0 520 490">
                    <!-- Województwa -->
                    <g onclick="claimVoivodeship(event)">
                        <path class="voivodeship" id="zachodniopomorskie" data-name="Zachodniopomorskie" d="M 40,90 L 110,75 L 135,145 L 85,170 L 35,140 Z"></path>
                        <text class="map-text" x="75" y="125">Zachodniopomorskie</text>

                        <path class="voivodeship" id="pomorskie" data-name="Pomorskie" d="M 110,75 L 195,65 L 225,135 L 135,145 Z"></path>
                        <text class="map-text" x="165" y="105">Pomorskie</text>

                        <path class="voivodeship" id="warminsko-mazurskie" data-name="Warmińsko-Mazurskie" d="M 195,65 L 290,75 L 280,150 L 225,135 Z"></path>
                        <text class="map-text" x="240" y="110">Warmińsko-Maz.</text>

                        <path class="voivodeship" id="podlaskie" data-name="Podlaskie" d="M 290,75 L 360,95 L 345,185 L 280,150 Z"></path>
                        <text class="map-text" x="315" y="135">Podlaskie</text>

                        <path class="voivodeship" id="lubuskie" data-name="Lubuskie" d="M 35,140 L 85,170 L 90,250 L 30,225 Z"></path>
                        <text class="map-text" x="60" y="195">Lubuskie</text>

                        <path class="voivodeship" id="wielkopolskie" data-name="Wielkopolskie" d="M 85,170 L 135,145 L 225,135 L 240,240 L 90,250 Z"></path>
                        <text class="map-text" x="160" y="190">Wielkopolskie</text>

                        <path class="voivodeship" id="kujawsko-pomorskie" data-name="Kujawsko-Pomorskie" d="M 225,135 L 280,150 L 260,220 L 240,240 Z"></path>
                        <text class="map-text" x="250" y="180">Kuj-Pom</text>

                        <path class="voivodeship" id="mazowieckie" data-name="Mazowieckie" d="M 280,150 L 345,185 L 330,270 L 260,220 Z"></path>
                        <text class="map-text" x="305" y="215">Mazowieckie</text>

                        <path class="voivodeship" id="lubelskie" data-name="Lubelskie" d="M 345,185 L 390,205 L 375,310 L 330,270 Z"></path>
                        <text class="map-text" x="355" y="250">Lubelskie</text>

                        <path class="voivodeship" id="dolnoslaskie" data-name="Dolnośląskie" d="M 30,225 L 90,250 L 135,315 L 80,350 L 40,305 Z"></path>
                        <text class="map-text" x="80" y="290">Dolnośląskie</text>

                        <path class="voivodeship" id="lodzkie" data-name="Łódzkie" d="M 240,240 L 260,220 L 330,270 L 315,335 L 220,310 Z"></path>
                        <text class="map-text" x="275" y="280">Łódzkie</text>

                        <path class="voivodeship" id="opolskie" data-name="Opolskie" d="M 135,315 L 170,305 L 185,375 L 130,365 Z"></path>
                        <text class="map-text" x="155" y="340">Opolskie</text>

                        <path class="voivodeship" id="slaskie" data-name="Śląskie" d="M 170,305 L 220,310 L 215,385 L 185,375 Z"></path>
                        <text class="map-text" x="195" y="345">Śląskie</text>

                        <path class="voivodeship" id="swietokrzyskie" data-name="Świętokrzyskie" d="M 315,335 L 330,270 L 375,310 L 350,385 L 295,380 Z"></path>
                        <text class="map-text" x="330" y="340">Świętokrzyskie</text>

                        <path class="voivodeship" id="malopolskie" data-name="Małopolskie" d="M 220,310 L 295,380 L 290,440 L 210,425 Z"></path>
                        <text class="map-text" x="250" y="375">Małopolskie</text>

                        <path class="voivodeship" id="podkarpackie" data-name="Podkarpackie" d="M 350,385 L 375,310 L 410,345 L 395,445 L 290,440 Z"></path>
                        <text class="map-text" x="355" y="380">Podkarpackie</text>
                    </g>

                    <!-- Oznaczenia miast na mapie -->
                    <g>
                        <!-- Warszawa (w Mazowieckiem) -->
                        <circle class="city-dot" cx="305" cy="215" r="3"></circle>
                        <text class="city-label" x="312" y="217">Warszawa</text>

                        <!-- Łódź (w Łódzkiem) -->
                        <circle class="city-dot" cx="265" cy="285" r="3"></circle>
                        <text class="city-label" x="220" y="295">Łódź</text>

                        <!-- Piotrków Trybunalski (w Łódzkiem) -->
                        <circle class="city-dot" cx="290" cy="305" r="2.5"></circle>
                        <text class="city-label" x="298" y="308">Piotrków Tryb.</text>

                        <!-- Radomsko (w Łódzkiem) -->
                        <circle class="city-dot" cx="275" cy="335" r="2.5"></circle>
                        <text class="city-label" x="230" y="340">Radomsko</text>

                        <!-- Płock (w Mazowieckiem) -->
                        <circle class="city-dot" cx="270" cy="190" r="2.5"></circle>
                        <text class="city-label" x="235" y="195">Płock</text>
                    </g>
                </svg>

                <p id="game-status" style="margin-top: 15px; font-weight: bold; font-size: 16px;"></p>
            </div>
            <button class="back-btn" onclick="stopGame(); hideSections();">Powrót do menu</button>
        </div>

        <!-- Opcja 3 -->
        <div id="notes-section" class="section-content">
            <h3>Twoje Notatki</h3>
            <textarea id="user-note" rows="4" placeholder="Wpisz swoją notatkę tutaj..."></textarea>
            <button onclick="saveNote()">Zapisz i wyślij</button>
            <p id="note-status" style="color: green; font-size: 14px;"></p>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>
    </div>

    <div id="secret-popup">:D</div>

    <script>
        function showSection(sectionId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function hideSections() {
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById('main-menu').style.display = 'grid';
        }

        function searchCity() {
            const city = document.getElementById('city-input').value;
            const resultDiv = document.getElementById('city-result');
            if(city.trim() === "") {
                resultDiv.innerText = "Wpisz nazwę miasta!";
                resultDiv.style.color = "red";
            } else {
                resultDiv.innerText = `Znaleziono dane dla miasta: ${city}. Status: Bezpieczne terytorium.`;
                resultDiv.style.color = "green";
            }
        }

        function saveNote() {
            const noteText = document.getElementById('user-note').value;
            if(noteText.trim() !== "") {
                localStorage.setItem('inteligent_note', noteText);
                document.getElementById('note-status').innerText = "Notatka została zapisana pomyślnie!";
            } else {
                document.getElementById('note-status').innerText = "Notatka jest pusta!";
                document.getElementById('note-status').style.color = "red";
            }
        }

        function triggerSecret() {
            const popup = document.getElementById('secret-popup');
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }

        /* LOGIKA BITWY Z ODBIERANIEM TERENÓW I BOTAMI CO 1 SEKUNDĘ */
        let scores = { green: 0, red: 0, blue: 0, yellow: 0 };
        let botInterval = null;

        function startGame() {
            scores = { green: 0, red: 0, blue: 0, yellow: 0 };
            document.getElementById('game-status').innerText = "";

            document.querySelectorAll('.voivodeship').forEach(el => {
                el.className.baseVal = "voivodeship";
            });

            updateScores();

            clearInterval(botInterval);
            botInterval = setInterval(botsAttack, 1000); // Boty atakują co dokładnie 1 sekundę
        }

        function stopGame() {
            clearInterval(botInterval);
        }

        function claimVoivodeship(event) {
            const element = event.target.closest('.voivodeship');
            if (!element) return;

            // Sprawdzamy, do kogo należało województwo przed kliknięciem gracza i odejmujemy punkty poprzedniemu właścicielowi
            if (element.classList.contains('player')) return; // Już Twoje

            if (element.classList.contains('bot-red')) scores.red--;
            if (element.classList.contains('bot-blue')) scores.blue--;
            if (element.classList.contains('bot-yellow')) scores.yellow--;

            // Czyscimy stare klasy i ustawiamy na gracza (Zielony)
            element.className.baseVal = "voivodeship player";
            scores.green++;

            updateScores();
            checkGameEnd();
        }

        function botsAttack() {
            const allVoivodeships = Array.from(document.querySelectorAll('.voivodeship'));
            // Boty mogą wybierać te tereny, które NIE są jeszcze zielone (Twoje)
            const available = allVoivodeships.filter(e => !e.classList.contains('player'));
            
            if (available.length === 0) {
                checkGameEnd();
                return;
            }

            const botTypes = ['bot-red', 'bot-blue', 'bot-yellow'];
            const randomBot = botTypes[Math.floor(Math.random() * botTypes.length)];
            const randomTarget = available[Math.floor(Math.random() * available.length)];

            // Odejmujemy punkt poprzedniemu właścicielowi, jeśli to był inny bot
            if (randomTarget.classList.contains('bot-red')) scores.red--;
            if (randomTarget.classList.contains('bot-blue')) scores.blue--;
            if (randomTarget.classList.contains('bot-yellow')) scores.yellow--;

            // Ustawiamy nowy kolor bota
            randomTarget.className.baseVal = "voivodeship " + randomBot;

            // Dodajemy punkt odpowiedniemu botowi
            if (randomBot === 'bot-red') scores.red++;
            if (randomBot === 'bot-blue') scores.blue++;
            if (randomBot === 'bot-yellow') scores.yellow++;

            updateScores();
            checkGameEnd();
        }

        function updateScores() {
            document.getElementById('score-green').innerText = scores.green;
            document.getElementById('score-red').innerText = scores.red;
            document.getElementById('score-blue').innerText = scores.blue;
            document.getElementById('score-yellow').innerText = scores.yellow;
        }

        function checkGameEnd() {
            const totalClaimed = scores.green + scores.red + scores.blue + scores.yellow;
            // Gra kończy się, gdy wszystkie 16 województw zostanie zajętych i zablokowanych na chwilę
            if (totalClaimed >= 16 && (scores.green + scores.red + scores.blue + scores.yellow >= 16)) {
                // Sprawdzamy dopiero gdy minie chwila, ale tu wystarczy podliczyć
            }
        }
    </script>
</body>
</html>
