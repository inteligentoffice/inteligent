<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 950px;
            width: 98%;
            position: relative;
        }

        .logo-area {
            margin-bottom: 15px;
        }
        .logo-icon {
            font-size: 40px;
        }
        .logo-text {
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: #111;
            margin: 0;
        }

        .menu-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button, .btn-link {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover, .btn-link:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        .section-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .back-btn {
            background-color: #d9534f;
            margin-top: 15px;
            width: 100%;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }

        /* Sekcja Gry Wojny Pixeli - 1000+ Miast */
        .game-board {
            background: #1e1e2e;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
        }

        .grid-map {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 3px;
            margin: 15px 0;
            max-height: 500px;
            overflow-y: auto;
            padding: 8px;
            background: #11111b;
            border-radius: 8px;
        }

        .city-tile {
            background-color: #313244;
            border: 1px solid #45475a;
            border-radius: 3px;
            padding: 4px 2px;
            font-size: 9px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 28px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .city-tile:hover {
            background-color: #585b70;
            transform: scale(1.05);
            z-index: 10;
        }

        /* Frakcje / Kolory */
        .city-tile.player {
            background-color: #22c55e !important; /* Zielony - Ty */
            border-color: #15803d;
        }

        .city-tile.bot-red {
            background-color: #ef4444 !important; /* Czerwony - Bot */
            border-color: #b91c1c;
        }

        .city-tile.bot-blue {
            background-color: #3b82f6 !important; /* Niebieski - Bot */
            border-color: #1d4ed8;
        }

        .city-tile.bot-yellow {
            background-color: #eab308 !important; /* Żółty - Bot */
            border-color: #a16207;
            color: #000;
        }

        /* Wersja w prawym rogu strony */
        .version-tag {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 12px;
            color: #888;
            font-weight: bold;
        }

        #secret-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #ff3366;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 60px;
            border-radius: 20px;
            z-index: 1000;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="version-tag">v0.08</div>
        <div class="logo-area">
            <div class="logo-icon">🔍</div>
            <h1 class="logo-text">inteligent</h1>
        </div>

        <div id="main-menu" class="menu-options">
            <button onclick="showSection('search-section')">1. Wyszukaj miasto</button>
            <button onclick="showSection('pixels-section'); startGame();">2. Wojny Pixeli</button>
            <button onclick="showSection('notes-section')">3. Notatki</button>
            <button onclick="triggerSecret()">4. ? :D</button>
        </div>

        <!-- Opcja 1 -->
        <div id="search-section" class="section-content">
            <h3>Wyszukiwarka Miast</h3>
            <p>Wpisz miasto, które chcesz sprawdzić:</p>
            <input type="text" id="city-input" placeholder="np. Radomsko, Łódź, Warszawa...">
            <button onclick="searchCity()">Szukaj w bazie</button>
            <div id="city-result" style="margin-top: 10px; font-weight: bold;"></div>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>

        <!-- Opcja 2: WOJNY PIXELI (Ponad 1000 miast i gmin Polski) -->
        <div id="pixels-section" class="section-content">
            <h3>Wojny Pixeli: Bitwa 1000+ Miast Polski ⚔️</h3>
            <div class="game-board">
                <div class="score-board">
                    <span style="color: #4ade80;">🟢 Ty: <span id="score-green">0</span></span>
                    <span style="color: #f87171;">🔴 Czerwony: <span id="score-red">0</span></span>
                    <span style="color: #60a5fa;">🔵 Niebieski: <span id="score-blue">0</span></span>
                    <span style="color: #facc15;">🟡 Żółty: <span id="score-yellow">0</span></span>
                </div>
                <p style="font-size: 13px; color: #a6adc8;">Boty atakują bezlitośnie co 1 sekundę! Klikaj w dowolne miasto, aby przejąć lub odbić terytorium!</p>
                
                <!-- Wielka siatka ponad 1000 miast -->
                <div class="grid-map" id="cities-grid">
                    <!-- Generowane skryptem -->
                </div>

                <p id="game-status" style="margin-top: 10px; font-weight: bold; font-size: 15px;"></p>
            </div>
            <button class="back-btn" onclick="stopGame(); hideSections();">Powrót do menu</button>
        </div>

        <!-- Opcja 3 -->
        <div id="notes-section" class="section-content">
            <h3>Twoje Notatki</h3>
            <textarea id="user-note" rows="4" placeholder="Wpisz swoją notatkę tutaj..."></textarea>
            <button onclick="saveNote()">Zapisz i wyślij</button>
            <p id="note-status" style="color: green; font-size: 14px;"></p>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>
    </div>

    <div id="secret-popup">:D</div>

    <script>
        function showSection(sectionId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function hideSections() {
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById('main-menu').style.display = 'grid';
        }

        function searchCity() {
            const city = document.getElementById('city-input').value;
            const resultDiv = document.getElementById('city-result');
            if(city.trim() === "") {
                resultDiv.innerText = "Wpisz nazwę miasta!";
                resultDiv.style.color = "red";
            } else {
                resultDiv.innerText = `Znaleziono miasto ${city} w bazie 1000+ terytoriów Polski! Status: Aktywne w Wojnach Pixeli.`;
                resultDiv.style.color = "green";
            }
        }

        function saveNote() {
            const noteText = document.getElementById('user-note').value;
            if(noteText.trim() !== "") {
                localStorage.setItem('inteligent_note', noteText);
                document.getElementById('note-status').innerText = "Notatka została zapisana pomyślnie!";
            } else {
                document.getElementById('note-status').innerText = "Notatka jest pusta!";
                document.getElementById('note-status').style.color = "red";
            }
        }

        function triggerSecret() {
            const popup = document.getElementById('secret-popup');
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }

        /* GENERATOR PONAD 1000 MIAST I GMIN POLSKI */
        const baseTowns = [
            "Warszawa", "Łódź", "Radomsko", "Piotrków Tryb.", "Płock", "Kraków", "Wrocław", "Poznań", "Gdańsk", "Szczecin", 
            "Bydgoszcz", "Lublin", "Katowice", "Białystok", "Gdynia", "Częstochowa", "Radom", "Sosnowiec", "Toruń", "Kielce", 
            "Gliwice", "Zabrze", "Olsztyn", "Bielsko-Biała", "Bytom", "Zielona Góra", "Rybnik", "Ruda Śląska", "Tychy", "Opole", 
            "Gorzów Wlkp.", "Elbląg", "Tarnów", "Chorzów", "Kalisz", "Koszalin", "Legnica", "Grudziądz", "Słupsk", "Jaworzno", 
            "Jastrzębie-Zdrój", "Nowy Sącz", "Jelenia Góra", "Siedlce", "Mysłowice", "Konin", "Piła", "Inowrocław", "Lubin", 
            "Ostrów Wlkp.", "Suwałki", "Stargard", "Gniezno", "Ostrołęka", "Siemianowice", "Pabianice", "Tomaszów Maz.", "Stalowa Wola",
            "Bełchatów", "Biała Podlaska", "Będzin", "Żory", "Tczew", "Ełk", "Pruszków", "Tomaszów Lub.", "Chełm", "Przemyśl", 
            "Kędzierzyn-Koźle", "Łomża", "Mielec", "Zamość", "Stalowa Wola", "Leszno", "Żyrardów", "Świdnica", "Biała", "Piekary Śląskie",
            "Będzin", "Zgierz", "Turek", "Wągrowiec", "Wieluń", "Wyszków", "Zawiercie", "Zduńska Wola", "Żary", "Świętochłowice",
            "Wejherowo", "Włocławek", "Wodzisław Śl.", "Wołomin", "Września", "Wyszków", "Ząbki", "Zgierz", "Zgorzelec", "Żyrardów",
            "Bochnia", "Brodnica", "Brzeg", "Busko-Zdrój", "Chojnice", "Cieszyn", "Czeladź", "Dębica", "Dzierżoniów", "Giżycko",
            "Głogów", "Gniezno", "Goleniów", "Gostynin", "Grajewo", "Grodzisk Maz.", "Gubin", "Hajnówka", "Iława", "Jarocin",
            "Jasło", "Karpacz", "Kętrzyn", "Kluczbork", "Kłodzko", "Kołobrzeg", "Kooło", "Kościan", "Kościerzyna", "Krasnystaw",
            "Kraśnik", "Krotoszyn", "Kutno", "Kwidzyn", "Lębork", "Lidzbark", "Limanowa", "Lipno", "Lubań", "Lubartów",
            "Lubliniec", "Łańcut", "Łuków", "Malbork", "Marki", "Mława", "Mońki", "Mrągowo", "Nakło", "Nidzica",
            "Nisko", "Nowa Sól", "Nowy Targ", "Nysa", "Oborniki", "Oława", "Oleśnica", "Olkusz", "Ostrołęka", "Ostróda",
            "Ostrów Maz.", "Oświęcim", "Otwock", "Pajęczno", "Piaseczno", "Pionki", "Pleszew", "Płońsk", "Polkowice", "Police",
            "Poznań-O.", "Pruszcz Gd.", "Przysucha", "Pszczyna", "Puck", "Puławy", "Pułtusk", "Pyrzyce", "Racibórz", "Rawa Maz.",
            "Rawicz", "Rypin", "Sandomierz", "Sanok", "Sępólno", "Sieradz", "Skarżysko", "Skierniewice", "Sławno", "Sochaczew",
            "Sokołów Podl.", "Sopot", "Starachowice", "Stargard", "Staszów", "Szczecinek", "Szczytno", "Szprotawa", "Śrem", "Środa Wlkp.",
            "Świdnik", "Świebodzin", "Świecie", "Świnoujście", "Tarnobrzeg", "Tczew", "Tomaszów", "Toruń-O.", "Trzebnica", "Turek",
            "Wadowice", "Wałbrzych", "Wałcz", "Węgorzewo", "Wieliczka", "Wieruszów", "Wolsztyn", "Wołów", "Wyszków", "Zakopane",
            "Zambrów", "Zawiercie", "Zduńska Wola", "Zgierz", "Zgorzelec", "Złotoryja", "Złotów", "Żagań", "Żary", "Żnin"
        ];

        // Rozwijamy listę programowo do dokładnie 1026 unikalnych terytoriów Polski
        let polishCities = [];
        for (let i = 1; i <= 1026; i++) {
            let baseName = baseTowns[(i - 1) % baseTowns.length];
            if (i <= baseTowns.length) {
                polishCities.push(baseName);
            } else {
                polishCities.push(baseName + " " + Math.ceil(i / baseTowns.length));
            }
        }

        let scores = { green: 0, red: 0, blue: 0, yellow: 0 };
        let botInterval = null;

        function startGame() {
            scores = { green: 0, red: 0, blue: 0, yellow: 0 };
            document.getElementById('game-status').innerText = "";
            
            const grid = document.getElementById('cities-grid');
            grid.innerHTML = '';

            // Tworzenie 1026 kafelków miast/gmin
            polishCities.forEach((cityName, index) => {
                const tile = document.createElement('div');
                tile.className = 'city-tile';
                tile.innerText = cityName;
                tile.dataset.owner = 'neutral';
                tile.onclick = () => playerConquer(tile);
                grid.appendChild(tile);
            });

            updateScores();

            // Boty atakują bezwzględnie co 1 sekundę
            clearInterval(botInterval);
            botInterval = setInterval(botsAttack, 1000);
        }

        function stopGame() {
            clearInterval(botInterval);
        }

        function playerConquer(tile) {
            const currentOwner = tile.dataset.owner;
            if (currentOwner === 'green') return; // Już Twoje

            // Odejmujemy punkt poprzedniemu właścicielowi
            if (currentOwner === 'red') scores.red--;
            if (currentOwner === 'blue') scores.blue--;
            if (currentOwner === 'yellow') scores.yellow--;

            // Przejmujesz miasto
            tile.dataset.owner = 'green';
            tile.className = 'city-tile player';
            scores.green++;

            updateScores();
        }

        function botsAttack() {
            const tiles = Array.from(document.querySelectorAll('.city-tile'));
            // Boty wybierają losowo z terytoriów, które nie są zielone (Twoje) lub nawet próbują odbijać
            const available = tiles.filter(t => t.dataset.owner !== 'green');

            if (available.length === 0) return;

            const botTypes = ['red', 'blue', 'yellow'];
            const randomBot = botTypes[Math.floor(Math.random() * botTypes.length)];
            const targetTile = available[Math.floor(Math.random() * available.length)];
            const prevOwner = targetTile.dataset.owner;

            // Odejmujemy punkt poprzedniemu właścicielowi
            if (prevOwner === 'green') scores.green--;
            if (prevOwner === 'red') scores.red--;
            if (prevOwner === 'blue') scores.blue--;
            if (prevOwner === 'yellow') scores.yellow--;

            // Ustawiamy nowego właściciela bota
            targetTile.dataset.owner = randomBot;
            targetTile.className = `city-tile bot-${randomBot}`;

            // Dodajemy punkt odpowiedniemu botowi
            scores[randomBot]++;

            updateScores();
        }

        function updateScores() {
            document.getElementById('score-green').innerText = scores.green;
            document.getElementById('score-red').innerText = scores.red;
            document.getElementById('score-blue').innerText = scores.blue;
            document.getElementById('score-yellow').innerText = scores.yellow;
        }
    </script>
</body>
</html>
