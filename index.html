<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 90%;
        }

        .logo-area {
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 50px;
        }
        .logo-text {
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: #111;
            margin: 0;
        }

        .menu-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button, .btn-link {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover, .btn-link:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        .section-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .back-btn {
            background-color: #d9534f;
            margin-top: 15px;
            width: 100%;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }

        /* Sekcja Gry Wojny Pixeli */
        .game-board {
            background: #1e1e2e;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .region-btn {
            background: #313244;
            border: 2px solid #45475a;
            color: white;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .region-btn.player {
            background: #22c55e !important;
            border-color: #16a34a !important;
        }

        .region-btn.bot {
            background: #ef4444 !important;
            border-color: #dc2626 !important;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        #secret-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #ff3366;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 60px;
            border-radius: 20px;
            z-index: 1000;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">🔍</div>
            <h1 class="logo-text">inteligent</h1>
        </div>

        <div id="main-menu" class="menu-options">
            <button onclick="showSection('search-section')">1. Wyszukaj miasto</button>
            <button onclick="showSection('pixels-section')">2. Wojny Pixeli</button>
            <button onclick="showSection('notes-section')">3. Notatki</button>
            <button onclick="triggerSecret()">4. ? :D</button>
        </div>

        <!-- Opcja 1 -->
        <div id="search-section" class="section-content">
            <h3>Wyszukiwarka Miast</h3>
            <p>Wpisz miasto, które chcesz sprawdzić:</p>
            <input type="text" id="city-input" placeholder="np. Warszawa, Kraków...">
            <button onclick="searchCity()">Szukaj w bazie</button>
            <div id="city-result" style="margin-top: 10px; font-weight: bold;"></div>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>

        <!-- Opcja 2: WOJNY PIXELI (Gra) -->
        <div id="pixels-section" class="section-content">
            <h3>Wojny Pixeli: Bitwa o Polskę ⚔️</h3>
            <div class="game-board">
                <div class="score-board">
                    <span style="color: #4ade80;">Ty: <span id="player-score">0</span></span>
                    <span style="color: #f87171;">Bot: <span id="bot-score">0</span></span>
                </div>
                <p style="font-size: 14px; color: #a6adc8;">Klikaj w regiony Polski, aby przejmować je przed botem!</p>
                
                <div class="regions-grid" id="map-grid">
                    <button class="region-btn" onclick="claimRegion(this, 'Mazowieckie')">Mazowieckie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Małopolskie')">Małopolskie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Wielkopolskie')">Wielkopolskie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Śląskie')">Śląskie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Pomorskie')">Pomorskie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Dolnośląskie')">Dolnośląskie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Łódzkie')">Łódzkie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Zachodniopomorskie')">Zachodniopomorskie</button>
                    <button class="region-btn" onclick="claimRegion(this, 'Lubelskie')">Lubelskie</button>
                </div>
                <p id="game-status" style="margin-top: 15px; font-weight: bold;"></p>
            </div>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>

        <!-- Opcja 3 -->
        <div id="notes-section" class="section-content">
            <h3>Twoje Notatki</h3>
            <textarea id="user-note" rows="4" placeholder="Wpisz swoją notatkę tutaj..."></textarea>
            <button onclick="saveNote()">Zapisz i wyślij</button>
            <p id="note-status" style="color: green; font-size: 14px;"></p>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>
    </div>

    <div id="secret-popup">:D</div>

    <script>
        function showSection(sectionId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function hideSections() {
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById('main-menu').style.display = 'grid';
        }

        function searchCity() {
            const city = document.getElementById('city-input').value;
            const resultDiv = document.getElementById('city-result');
            if(city.trim() === "") {
                resultDiv.innerText = "Wpisz nazwę miasta!";
                resultDiv.style.color = "red";
            } else {
                resultDiv.innerText = `Znaleziono dane dla miasta: ${city}. Status: Bezpieczne terytorium.`;
                resultDiv.style.color = "green";
            }
        }

        function saveNote() {
            const noteText = document.getElementById('user-note').value;
            if(noteText.trim() !== "") {
                localStorage.setItem('inteligent_note', noteText);
                document.getElementById('note-status').innerText = "Notatka została zapisana pomyślnie!";
            } else {
                document.getElementById('note-status').innerText = "Notatka jest pusta!";
                document.getElementById('note-status').style.color = "red";
            }
        }

        function triggerSecret() {
            const popup = document.getElementById('secret-popup');
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }

        /* LOGIKA GRY WOJNY PIXELI */
        let playerScore = 0;
        let botScore = 0;

        function claimRegion(btn, name) {
            if (btn.classList.contains('player') || btn.classList.contains('bot')) return;

            // Gracz przejmuje region
            btn.classList.add('player');
            playerScore++;
            document.getElementById('player-score').innerText = playerScore;

            // Ruch bota po 0.5 sekundy
            setTimeout(botTurn, 500);
        }

        function botTurn() {
            const available = Array.from(document.querySelectorAll('.region-btn')).filter(b => !b.classList.contains('player') && !b.classList.contains('bot'));
            if (available.length > 0) {
                const randomBtn = available[Math.floor(Math.random() * available.length)];
                randomBtn.classList.add('bot');
                botScore++;
                document.getElementById('bot-score').innerText = botScore;
            }

            checkWinner();
        }

        function checkWinner() {
            const total = document.querySelectorAll('.region-btn').length;
            if (playerScore + botScore === total) {
                const status = document.getElementById('game-status');
                if (playerScore > botScore) {
                    status.innerText = "🎉 ZWYCIĘSTWO! Przejąłeś Polskę!";
                    status.style.color = "#4ade80";
                } else {
                    status.innerText = "❌ PRZEGRANA! Bot zajął więcej terytoriów!";
                    status.style.color = "#f87171";
                }
            }
        }
    </script>
</body>
</html>
