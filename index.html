<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 90%;
        }

        .logo-area {
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 50px;
        }
        .logo-text {
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: #111;
            margin: 0;
        }

        .menu-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button, .btn-link {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover, .btn-link:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        .section-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .back-btn {
            background-color: #d9534f;
            margin-top: 15px;
            width: 100%;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }

        /* Sekcja Gry Wojny Pixeli */
        .game-board {
            background: #1e1e2e;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        #poland-map {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .voivodeship {
            fill: #313244;
            stroke: #45475a;
            stroke-width: 2;
            cursor: pointer;
            transition: fill 0.3s, transform 0.2s;
        }

        .voivodeship:hover {
            fill: #585b70;
        }

        .voivodeship.player {
            fill: #22c55e !important;
            stroke: #16a34a !important;
        }

        .voivodeship.bot {
            fill: #ef4444 !important;
            stroke: #dc2626 !important;
        }

        #secret-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #ff3366;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 60px;
            border-radius: 20px;
            z-index: 1000;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">🔍</div>
            <h1 class="logo-text">inteligent</h1>
        </div>

        <div id="main-menu" class="menu-options">
            <button onclick="showSection('search-section')">1. Wyszukaj miasto</button>
            <button onclick="showSection('pixels-section'); startGame();">2. Wojny Pixeli</button>
            <button onclick="showSection('notes-section')">3. Notatki</button>
            <button onclick="triggerSecret()">4. ? :D</button>
        </div>

        <!-- Opcja 1 -->
        <div id="search-section" class="section-content">
            <h3>Wyszukiwarka Miast</h3>
            <p>Wpisz miasto, które chcesz sprawdzić:</p>
            <input type="text" id="city-input" placeholder="np. Warszawa, Kraków...">
            <button onclick="searchCity()">Szukaj w bazie</button>
            <div id="city-result" style="margin-top: 10px; font-weight: bold;"></div>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>

        <!-- Opcja 2: WOJNY PIXELI -->
        <div id="pixels-section" class="section-content">
            <h3>Wojny Pixeli: Bitwa o Polskę ⚔️</h3>
            <div class="game-board">
                <div class="score-board">
                    <span style="color: #4ade80;">Ty: <span id="player-score">0</span></span>
                    <span style="color: #f87171;">Bot (atakuje automatycznie!): <span id="bot-score">0</span></span>
                </div>
                <p style="font-size: 14px; color: #a6adc8;">Szybko przejmuj województwa! Bot atakuje sam bez zatrzymania!</p>
                
                <!-- Interaktywna Mapa Polski -->
                <svg id="poland-map" viewBox="0 0 600 550">
                    <path class="voivodeship" id="pomorskie" d="M 200,30 L 320,20 L 350,90 L 260,120 L 180,90 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="250" y="70" fill="white" font-size="12" pointer-events="none">Pomorskie</text>

                    <path class="voivodeship" id="zachodniopomorskie" d="M 80,50 L 200,30 L 180,90 L 130,150 L 60,120 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="100" y="90" fill="white" font-size="11" pointer-events="none">Zachodnio-pom.</text>

                    <path class="voivodeship" id="warminsko-mazurskie" d="M 320,20 L 470,30 L 480,120 L 350,90 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="370" y="65" fill="white" font-size="11" pointer-events="none">Warmińsko-Maz.</text>

                    <path class="voivodeship" id="podlaskie" d="M 470,30 L 560,70 L 540,200 L 450,180 L 480,120 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="480" y="120" fill="white" font-size="12" pointer-events="none">Podlaskie</text>

                    <path class="voivodeship" id="lubuskie" d="M 60,120 L 130,150 L 120,240 L 50,210 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="70" y="180" fill="white" font-size="12" pointer-events="none">Lubuskie</text>

                    <path class="voivodeship" id="wielkopolskie" d="M 130,150 L 260,120 L 280,240 L 180,260 L 120,240 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="170" y="190" fill="white" font-size="12" pointer-events="none">Wielkopolskie</text>

                    <path class="voivodeship" id="kujawsko-pomorskie" d="M 260,120 L 350,90 L 370,170 L 280,180 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="280" y="150" fill="white" font-size="10" pointer-events="none">Kujawsko-Pom.</text>

                    <path class="voivodeship" id="mazowieckie" d="M 350,90 L 480,120 L 450,180 L 460,280 L 330,270 L 370,170 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="380" y="200" fill="white" font-size="13" pointer-events="none">Mazowieckie</text>

                    <path class="voivodeship" id="dolnoslaskie" d="M 50,210 L 120,240 L 180,260 L 150,340 L 70,300 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="80" y="270" fill="white" font-size="12" pointer-events="none">Dolnośląskie</text>

                    <path class="voivodeship" id="lodzkie" d="M 280,240 L 330,270 L 320,340 L 240,330 L 180,260 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="250" y="295" fill="white" font-size="12" pointer-events="none">Łódzkie</text>

                    <path class="voivodeship" id="lubelskie" d="M 450,180 L 540,200 L 530,330 L 430,320 L 460,280 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="460" y="260" fill="white" font-size="12" pointer-events="none">Lubelskie</text>

                    <path class="voivodeship" id="opolskie" d="M 180,260 L 240,330 L 210,380 L 150,340 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="175" y="330" fill="white" font-size="10" pointer-events="none">Opolskie</text>

                    <path class="voivodeship" id="slaskie" d="M 240,330 L 320,340 L 300,420 L 210,380 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="250" y="370" fill="white" font-size="12" pointer-events="none">Śląskie</text>

                    <path class="voivodeship" id="swietokrzyskie" d="M 320,340 L 430,320 L 400,390 L 300,380 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="330" y="360" fill="white" font-size="10" pointer-events="none">Świętokrzyskie</text>

                    <path class="voivodeship" id="malopolskie" d="M 300,380 L 400,390 L 380,480 L 280,460 L 300,420 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="310" y="430" fill="white" font-size="12" pointer-events="none">Małopolskie</text>

                    <path class="voivodeship" id="podkarpackie" d="M 400,390 L 530,330 L 500,490 L 380,480 Z" onclick="claimVoivodeship(this)"></path>
                    <text x="420" y="440" fill="white" font-size="11" pointer-events="none">Podkarpackie</text>
                </svg>

                <p id="game-status" style="margin-top: 15px; font-weight: bold; font-size: 18px;"></p>
            </div>
            <button class="back-btn" onclick="stopGame(); hideSections();">Powrót do menu</button>
        </div>

        <!-- Opcja 3 -->
        <div id="notes-section" class="section-content">
            <h3>Twoje Notatki</h3>
            <textarea id="user-note" rows="4" placeholder="Wpisz swoją notatkę tutaj..."></textarea>
            <button onclick="saveNote()">Zapisz i wyślij</button>
            <p id="note-status" style="color: green; font-size: 14px;"></p>
            <button class="back-btn" onclick="hideSections()">Powrót do menu</button>
        </div>
    </div>

    <div id="secret-popup">:D</div>

    <script>
        function showSection(sectionId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function hideSections() {
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.getElementById('main-menu').style.display = 'grid';
        }

        function searchCity() {
            const city = document.getElementById('city-input').value;
            const resultDiv = document.getElementById('city-result');
            if(city.trim() === "") {
                resultDiv.innerText = "Wpisz nazwę miasta!";
                resultDiv.style.color = "red";
            } else {
                resultDiv.innerText = `Znaleziono dane dla miasta: ${city}. Status: Bezpieczne terytorium.`;
                resultDiv.style.color = "green";
            }
        }

        function saveNote() {
            const noteText = document.getElementById('user-note').value;
            if(noteText.trim() !== "") {
                localStorage.setItem('inteligent_note', noteText);
                document.getElementById('note-status').innerText = "Notatka została zapisana pomyślnie!";
            } else {
                document.getElementById('note-status').innerText = "Notatka jest pusta!";
                document.getElementById('note-status').style.color = "red";
            }
        }

        function triggerSecret() {
            const popup = document.getElementById('secret-popup');
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }

        /* LOGIKA MAPY I AUTOMATYCZNEGO BOTA */
        let playerScore = 0;
        let botScore = 0;
        let botInterval = null;

        function startGame() {
            // Resetowanie stanu gry
            playerScore = 0;
            botScore = 0;
            document.getElementById('player-score').innerText = 0;
            document.getElementById('bot-score').innerText = 0;
            document.getElementById('game-status').innerText = "";

            document.querySelectorAll('.voivodeship').forEach(el => {
                el.classList.remove('player', 'bot');
            });

            // Uruchomienie automatycznych ataków bota co 1.5 sekundy (1500 ms)
            clearInterval(botInterval);
            botInterval = setInterval(botAttack, 1500);
        }

        function stopGame() {
            clearInterval(botInterval);
        }

        function claimVoivodeship(element) {
            if (element.classList.contains('player') || element.classList.contains('bot')) return;

            element.classList.add('player');
            playerScore++;
            document.getElementById('player-score').innerText = playerScore;

            checkWinner();
        }

        function botAttack() {
            const available = Array.from(document.querySelectorAll('.voivodeship')).filter(e => !e.classList.contains('player') && !e.classList.contains('bot'));
            if (available.length > 0) {
                const randomElem = available[Math.floor(Math.random() * available.length)];
                randomElem.classList.add('bot');
                botScore++;
                document.getElementById('bot-score').innerText = botScore;
            }

            checkWinner();
        }

        function checkWinner() {
            const total = document.querySelectorAll('.voivodeship').length;
            if (playerScore + botScore >= total) {
                stopGame();
                const status = document.getElementById('game-status');
                if (playerScore > botScore) {
                    status.innerText = "🎉 ZWYCIĘSTWO! Opanowałeś całą Polskę!";
                    status.style.color = "#4ade80";
                } else if (botScore > playerScore) {
                    status.innerText = "❌ PRZEGRANA! Bot przejął większość Polski!";
                    status.style.color = "#f87171";
                } else {
                    status.innerText = "🤝 REMIS! Podzieliliście Polskę po połowie!";
                    status.style.color = "#facc15";
                }
            }
        }
    </script>
</body>
</html>
